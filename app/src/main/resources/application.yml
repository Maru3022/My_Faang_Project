spring:
  application:
    name: devpath-ai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devpath}
    username: ${DATABASE_USER:devpath}
    password: ${DATABASE_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          jwk-set-uri: ${OIDC_JWK_SET_URI}
          audiences: ${OIDC_AUDIENCE:devpath-api}
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
server:
  error:
    include-message: never
    include-stacktrace: never
