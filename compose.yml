services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devpath
      POSTGRES_USER: devpath
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpath -d devpath"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/devpath
      DATABASE_USER: devpath
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?Set OIDC_ISSUER_URI}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:?Set OIDC_JWK_SET_URI}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-devpath-api}
      OPENAPI_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
